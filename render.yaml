services:
  - type: web
    name: rolerocket-ai
    runtime: node
    buildCommand: cd "$PWD/backend" && npm install
    startCommand: cd "$PWD/backend" && npm start
    autoDeploy: true
    envVars:
      # ── Runtime ────────────────────────────────────────────────────────────
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.19.0
      - key: CLIENT_URL
        value: https://www.rolerocketai.com
      - key: WHATSAPP_PATOIS_FLOW_ENABLED
        value: "true"
      - key: WHATSAPP_PATOIS_FLOW_ROLLOUT_PERCENT
        value: "100"

      # ── Auth / DB (set these in the Render dashboard — never commit values) ─
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DB_DIAGNOSTIC_TOKEN
        sync: false

      # ── OpenAI ─────────────────────────────────────────────────────────────
      - key: OPENAI_API_KEY
        sync: false

      # ── Twilio WhatsApp interactive templates ────────────────────────────
      - key: TWILIO_WHATSAPP_LANGUAGE_PATOIS_CONTENT_SID
        value: HX4a78c65324e40b0f8f32ee50d1c4f1d9
      - key: TWILIO_WHATSAPP_PATOIS_QUICK_CONTENT_SID
        value: HX20b5be9929169f490bb51dcc4a9a6a3d
      - key: TWILIO_WHATSAPP_JOBS_ROLE_CONTENT_SID
        value: HXf8a6f2b0453f7b4263110df7e34e325c
      - key: TWILIO_WHATSAPP_RESUME_CAPTURE_CONTENT_SID
        value: HX242a7fc4f3318fd4568e990c7488a294
      - key: TWILIO_WHATSAPP_COVER_CAPTURE_CONTENT_SID
        value: HX37b1689edfaa86bcb8e9c22448ecc098
      - key: TWILIO_WHATSAPP_INTERVIEW_TARGET_CONTENT_SID
        value: HXa3b8923649b28acc1d1bd36aee78f109
      - key: TWILIO_WHATSAPP_COACH_CAPTURE_CONTENT_SID
        value: HX1c30204fd8ed6ed000f94b31f602b61f
      - key: TWILIO_WHATSAPP_HUMAN_CAPTURE_CONTENT_SID
        value: HX90b7afb6a822c857294c12349f14471b

      # ── Stripe ─────────────────────────────────────────────────────────────
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRO_PRICE_ID
        sync: false
      - key: STRIPE_PREMIUM_PRICE_ID
        sync: false
      - key: STRIPE_ELITE_PRICE_ID
        sync: false
      - key: STRIPE_LIFETIME_PRICE_ID
        sync: false

      # ── Email (optional — password reset) ──────────────────────────────────
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

      # ── Job sources ────────────────────────────────────────────────────────
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: ADZUNA_COUNTRY
        value: us
      - key: GREENHOUSE_BOARDS
        value: openai,stripe,airbnb,notion,figma,datadog,coinbase,pinterest,doordash,uber,shopify,canva
      - key: LEVER_BOARDS
        value: netflix,figma,robinhood,asana,coursera,eventbrite,clearbit,help-scout
      - key: REMOTIVE_ENABLED
        value: "1"
      - key: ARBEITNOW_ENABLED
        value: "1"
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false