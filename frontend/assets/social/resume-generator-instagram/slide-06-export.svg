<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
  <rect width="1080" height="1350" fill="#F5F3F8"/>
  <circle cx="170" cy="1094" r="318" fill="#FED7AA" fill-opacity="0.26"/>
  <path d="M0 1008 C248 964, 422 1044, 614 1180" stroke="#111827" stroke-opacity="0.3" stroke-width="2" fill="none"/>

  <text x="72" y="194" fill="#111827" font-size="82" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Step 5: Export</text>
  <text x="72" y="264" fill="#111827" font-size="82" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">for applications</text>
  <text x="72" y="336" fill="#374151" font-size="42" font-weight="500" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Download in the format you need.</text>

  <text x="92" y="450" fill="#111827" font-size="39" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">1. Click Export</text>
  <text x="92" y="506" fill="#111827" font-size="39" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">2. Choose PDF or Word</text>
  <text x="92" y="562" fill="#111827" font-size="39" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">3. Save and upload to job application</text>

  <g transform="translate(296 610)">
    <rect width="730" height="522" rx="40" fill="#FFFFFF"/>
    <text x="42" y="78" fill="#111827" font-size="36" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Choose export format</text>

    <rect x="42" y="106" width="204" height="252" rx="24" fill="#F97316"/>
    <text x="144" y="204" text-anchor="middle" fill="#FFFFFF" font-size="62" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">PDF</text>
    <rect x="62" y="276" width="164" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.24"/>
    <text x="144" y="310" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Save PDF</text>

    <rect x="262" y="106" width="204" height="252" rx="24" fill="#2563EB"/>
    <text x="364" y="204" text-anchor="middle" fill="#FFFFFF" font-size="58" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">DOC</text>
    <rect x="282" y="276" width="164" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.24"/>
    <text x="364" y="310" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Save Word</text>

    <rect x="482" y="106" width="204" height="252" rx="24" fill="#7C3AED"/>
    <text x="584" y="190" text-anchor="middle" fill="#FFFFFF" font-size="45" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">EMAIL</text>
    <rect x="502" y="276" width="164" height="52" rx="14" fill="#FFFFFF" fill-opacity="0.24"/>
    <text x="584" y="310" text-anchor="middle" fill="#FFFFFF" font-size="25" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Send</text>

    <rect x="42" y="386" width="644" height="108" rx="20" fill="#111827"/>
    <text x="72" y="446" fill="#E5E7EB" font-size="31" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Tip: Use PDF for most job portals</text>
