  <path d="M988 416 L936 416" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M936 416 L954 398" stroke="#111827" stroke-width="5" stroke-linecap="round"/>
  <path d="M936 416 L954 434" stroke="#111827" stroke-width="5" stroke-linecap="round"/>

  <text x="132" y="1256" fill="#111827" font-size="168" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">5</text>
  <text x="974" y="1272" text-anchor="end" fill="#4F46E5" font-size="42" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">6 / 7</text>
