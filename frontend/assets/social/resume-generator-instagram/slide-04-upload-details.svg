  <text x="72" y="264" fill="#111827" font-size="82" font-weight="800" font-family="Sora, Avenir Next, Segoe UI, sans-serif">resume + job post</text>
  <text x="72" y="336" fill="#374151" font-size="42" font-weight="500" font-family="Sora, Avenir Next, Segoe UI, sans-serif">Feed the AI the exact context it needs.</text>

  <text x="92" y="450" fill="#111827" font-size="39" font-weight="700" font-family="Sora, Avenir Next, Segoe UI, sans-serif">1. Upload PDF, DOCX, or TXT resume</text>
